name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Helpers.slnx

      - name: Build
        run: dotnet build Helpers.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Helpers.slnx --configuration Release --no-build --verbosity normal
