name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Values from the event (the tag name, the repository) reach the scripts only through
# environment variables, never pasted into the script text, so a tag name can't inject code.
env:
  REF_NAME: ${{ github.ref_name }}
  REPOSITORY: ${{ github.repository }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version from the tag
        id: version
        shell: pwsh
        run: |
          $v = $env:REF_NAME.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "The tag '$env:REF_NAME' isn't a version such as v1.2.3." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet test tests/Helpers.Tests --configuration Release

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Helpers.App --configuration Release --runtime win-x64 --self-contained true `
            "-p:Version=$env:VERSION" -p:PublishSingleFile=false --output out/publish/win-x64
          if ($LASTEXITCODE -ne 0) { throw "Publish failed with $LASTEXITCODE" }

      - name: Drop native debug symbols
        shell: pwsh
        run: Get-ChildItem out/publish/win-x64 -Filter *.pdb | Remove-Item

      - name: Zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path out/publish/win-x64/* -DestinationPath "out/Helpers-$env:VERSION-win-x64.zip"

      # GitHub's Windows images include Inno Setup 6. Nothing is downloaded here: if it's ever
      # missing, the release stops rather than fetching a build tool from a public feed.
      - name: Installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 isn't on this runner image. Check actions/runner-images before changing this step." }
          & $iscc installer\Helpers.iss "/DVersion=$env:VERSION" "/DPublishDir=..\out\publish\win-x64"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Version file for the app's opt-in update check
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $base = "https://github.com/$env:REPOSITORY/releases/download/$env:REF_NAME"
          $info = [ordered]@{
            version = $v
            notes = "See the release page for what changed."
            page = "https://github.com/$env:REPOSITORY/releases/tag/$env:REF_NAME"
            installer = [ordered]@{ url = "$base/Helpers-$v-setup.exe"; sha256 = (Get-FileHash "out/Helpers-$v-setup.exe" -Algorithm SHA256).Hash.ToLower() }
            zip = [ordered]@{ url = "$base/Helpers-$v-win-x64.zip"; sha256 = (Get-FileHash "out/Helpers-$v-win-x64.zip" -Algorithm SHA256).Hash.ToLower() }
          }
          $info | ConvertTo-Json -Depth 4 | Set-Content out/version.json -Encoding utf8
          Get-Content out/version.json

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:VERSION
          $files = @("out/Helpers-$v-setup.exe", "out/Helpers-$v-win-x64.zip", "out/version.json")
          $notes = "docs/releases/v$v.md"
          if (Test-Path $notes) {
            gh release create $env:REF_NAME --title "Helpers $v" --notes-file $notes @files
          } else {
            gh release create $env:REF_NAME --title "Helpers $v" --generate-notes @files
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE" }
