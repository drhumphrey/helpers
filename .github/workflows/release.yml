name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version from the tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Test
        run: dotnet test tests/Helpers.Tests --configuration Release

      - name: Publish
        run: >
          dotnet publish src/Helpers.App --configuration Release --runtime win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }} -p:PublishSingleFile=false
          --output out/publish/win-x64

      - name: Drop native debug symbols
        shell: pwsh
        run: Get-ChildItem out/publish/win-x64 -Filter *.pdb | Remove-Item

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/publish/win-x64/* -DestinationPath "out/Helpers-${{ steps.version.outputs.version }}-win-x64.zip"

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Helpers.iss "/DVersion=${{ steps.version.outputs.version }}" "/DPublishDir=..\out\publish\win-x64"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - name: Version file for the app's opt-in update check
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $info = [ordered]@{
            version = $v
            notes = "See the release page for what changed."
            page = "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
            installer = [ordered]@{ url = "$base/Helpers-$v-setup.exe"; sha256 = (Get-FileHash "out/Helpers-$v-setup.exe" -Algorithm SHA256).Hash.ToLower() }
            zip = [ordered]@{ url = "$base/Helpers-$v-win-x64.zip"; sha256 = (Get-FileHash "out/Helpers-$v-win-x64.zip" -Algorithm SHA256).Hash.ToLower() }
          }
          $info | ConvertTo-Json -Depth 4 | Set-Content out/version.json -Encoding utf8
          Get-Content out/version.json

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $files = @("out/Helpers-$v-setup.exe", "out/Helpers-$v-win-x64.zip", "out/version.json")
          $notes = "docs/releases/v$v.md"
          if (Test-Path $notes) {
            gh release create "${{ github.ref_name }}" --title "Helpers $v" --notes-file $notes @files
          } else {
            gh release create "${{ github.ref_name }}" --title "Helpers $v" --generate-notes @files
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE" }
